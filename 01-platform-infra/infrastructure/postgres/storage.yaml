apiVersion: v1
kind: PersistentVolume
metadata:
  name: ecommerce-postgres-pv  # Change the name to be unique!
  labels:
    app: ecommerce-postgres
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi  # Increased to 5Gi to match our original plan
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/ecommerce-postgres" # Give it a unique host path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecommerce-postgres-pvc  # Change the name to be unique!
  namespace: ecommerce-app
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: ecommerce-postgres # This forces it to bind to the PV above