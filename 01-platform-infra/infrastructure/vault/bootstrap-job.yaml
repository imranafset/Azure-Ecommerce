apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unsealer-v3
  namespace: vault
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: vault-unsealer
        image: hashicorp/vault:1.16.1
        env:
        - name: UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key1
        command: ["/bin/sh", "-c"]
        args:
          - |
            export VAULT_ADDR=http://vault.vault.svc:8200
            
            echo "Waiting for Vault..."
            until vault status -tls-skip-verify > /dev/null 2>&1 || [ $? -eq 2 ]; do
              sleep 2
            done

            if [ "$(vault status -format=json -tls-skip-verify | jq -r '.sealed')" = "true" ]; then
              echo "Vault is sealed. Unsealing now..."
              vault operator unseal -tls-skip-verify $UNSEAL_KEY
            else
              echo "Vault is already unsealed. Nothing to do."
            fi