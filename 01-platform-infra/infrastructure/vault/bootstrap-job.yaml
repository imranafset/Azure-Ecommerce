apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unsealer-v5
  namespace: vault
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: vault-unsealer
        image: hashicorp/vault:1.16.1
        env:
        - name: UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal-keys
              key: key1
        command: ["/bin/sh", "-c"]
        args:
          - |
            export VAULT_ADDR=http://vault.vault.svc:8200
            
            echo "Waiting for Vault API..."
            until vault status -tls-skip-verify > /dev/null 2>&1 || [ $? -eq 2 ]; do
              sleep 5
            done

            # Check status using grep instead of jq
            while vault status -tls-skip-verify | grep -q "Sealed.*true"; do
              echo "Vault is sealed. Sending unseal key..."
              vault operator unseal -tls-skip-verify $UNSEAL_KEY
              sleep 5
            done

            echo "Vault is now UNSEALED!"