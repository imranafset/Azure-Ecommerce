apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unsealer
  namespace: vault
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: vault-unsealer
        image: hashicorp/vault:1.16.1
        env:
        - name: UNSEAL_KEY
          value: YPNw+tMJkvT7pdHwJrJkIXxt5/2WYHQ4x/OGcJNw14E=
        command: ["/bin/sh", "-c"]
        args:
          - |
            export VAULT_ADDR=http://vault.vault.svc:8200
            until vault status -tls-skip-verify > /dev/null 2>&1 || [ $? -eq 2 ]; do
              echo "Waiting for Vault to be ready..."
              sleep 5
            done

            if [ "$(vault status -format=json | jq -r '.sealed')" = "true" ]; then
              echo "Vault is sealed unsealing..."
            else
              echo "Vault is already unsealed."
            fi