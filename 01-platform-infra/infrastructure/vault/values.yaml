global:
  enabled: true

server:
  enabled: true

  image:
    repository: "hashicorp/vault"
    tag: "1.15.2"

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Enable Vault Web UI
  ui:
    enabled: true

  # Development-friendly storage
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: standard

  # HA disabled for local cluster
  ha:
    enabled: false

  # File storage backend
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = 1
      }

      storage "file" {
        path = "/vault/data"
      }

      disable_mlock = true

  service:
    enabled: true
    type: ClusterIP
    port: 8200

injector:
  enabled: true