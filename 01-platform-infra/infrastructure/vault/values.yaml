global:
  enabled: true

server:
  enabled: true

  image:
    repository: hashicorp/vault
    tag: "1.15.2"

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  ui:
    enabled: true

  # ✅ THIS IS THE IMPORTANT PART
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: microk8s-hostpath   # 🔴 IMPORTANT for MicroK8s

  ha:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = 1
      }

      storage "file" {
        path = "/vault/data"
      }

      disable_mlock = true

  service:
    enabled: true
    type: ClusterIP
    port: 8200

injector:
  enabled: true