apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.2.6

    helm:
      skipCRDs: true
      values: |
        admissionController:
          replicas: 1

        image:
          registry: core.harbor.domain/ecommerce

        initContainer:
          image:
            repository: bitnami/kubectl
            tag: latest

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true