apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.2.6   # stable version

    helm:
      skipCRDs: true
      values: |
        admissionController:
          replicas: 1
       
        cleanupJobs:
          kubectl:
             image:
               repository: core.habor.domain/ecommerce/bitnami/kubectl
               tag: 1.27.3
               pullPolicy: IfNotPresent
        image:
          registry: ghcr.io
            
        
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true