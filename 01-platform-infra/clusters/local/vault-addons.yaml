apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-addons
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/imran-devsecops/azure-ecommerce.git
    targetRevision: HEAD
    path: 01-platform-infra/infrastructure/vault

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true