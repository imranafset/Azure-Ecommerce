apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-infra
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/imran-devsecops/azure-ecommerce.git
    targetRevision: main
    path: 01-platform-infra/infrastructure/postgres # Where your new files are
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true