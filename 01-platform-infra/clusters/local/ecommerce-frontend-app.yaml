apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/imran-devsecops/azure-ecommerce.git
    targetRevision: HEAD
    path: 03-ecommerce-app/frontend/k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true