spring.datasource.url=jdbc:postgresql://postgres-service:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# REPLACE the previous init lines with this one:
# This tells Hibernate specifically to look for the import.sql file
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health